<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Em que país voce mora?</h1>
    <input type="text" name="textp" id="textp">
    <input type="button" value="Confirmar" onclick="confirmar()">
    <div id="res"></div>

    <script> //Atividade - Fazer ex009 em formato de site igual foi feito no exercicio 10. 
        function confirmar () {
        var pais = window.document.getElementById('textp').value 
        var res = window.document.getElementById('res')
        res.innerHTML = `<p>Vivendo em <strong> ${pais} </strong></p>`
        if (pais == 'Brasil') {
            res.innerHTML += `<p> Voce é Brasileiro </p>`
        } else {
            res.innerHTML += `<p> Voce é Estrangeiro </p>`
        }
         }
        
    </script>
</body>
</html>
